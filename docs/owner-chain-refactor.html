}

  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,

  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {

.form-switch .form-check-input {

  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {

  padding: 0;

.form-range::-webkit-slider-runnable-track {

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);

.form-range::-moz-range-track {
  height: 28px;

    &lt;pre class=&quot;pob-code&quot;&gt;&lt;code&gt;Each managed ViewModel generation owns one internal dependency binding.
A successful nested resolve binds the child to that virtual binding.
The child stays alive while the parent generation stays alive.

Root A / Root B own VM1.
VM1.virtual owns VM2.
Root bindings A / B are mirrored to VM2 with source-aware references.
Removing one path never removes another direct or parent path.&lt;/code&gt;&lt;/pre&gt;

          &lt;tr&gt;&lt;td&gt;版本边界&lt;/td&gt;&lt;td&gt;当前代码已采用新的 unkeyed identity、watch 冒泡、aliveForever 与 recycle 契约；发布时应明确标记为 lifecycle/identity 行为变化，而不是静默补丁。&lt;/td&gt;&lt;/tr&gt;

      &lt;table class=&quot;table table-sm&quot;&gt;
        &lt;thead&gt;
          &lt;tr&gt;&lt;th&gt;解析方式&lt;/th&gt;&lt;th&gt;Effective scope&lt;/th&gt;&lt;th&gt;结果&lt;/th&gt;&lt;/tr&gt;
        &lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;VM1 内解析 unkeyed VM2&lt;/td&gt;&lt;td&gt;VM1.virtual 的私有 default key&lt;/td&gt;&lt;td&gt;同一个 VM1 generation 内同类型复用；不同 parent 默认隔离。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Root 直接解析 unkeyed VM2&lt;/td&gt;&lt;td&gt;Root 自己的私有 default key&lt;/td&gt;&lt;td&gt;不会与 VM1 的私有 child 偶然合并。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;多个 parent 解析同 key VM2&lt;/td&gt;&lt;td&gt;&lt;code&gt;T + explicit key&lt;/code&gt;&lt;/td&gt;&lt;td&gt;共享同一个 child handle；每个 virtual binding 分别持有一份引用。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Root 与 parent 解析同 key VM2&lt;/td&gt;&lt;td&gt;&lt;code&gt;T + explicit key&lt;/code&gt;&lt;/td&gt;&lt;td&gt;direct owner 与 virtual owner 共存；最后一个 owner 离开后才 dispose。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;同一 parent 需要多个同类型 child&lt;/td&gt;&lt;td&gt;不同 explicit keys&lt;/td&gt;&lt;td&gt;保持现有“同 T 多实例必须明确 key”的规则。&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;pob-section&quot; aria-labelledby=&quot;pob-reactivity-title&quot;&gt;
    &lt;div class=&quot;pob-section-head&quot;&gt;
      &lt;h2 id=&quot;pob-reactivity-title&quot;&gt;read、watch 与 listen&lt;/h2&gt;
      &lt;span class=&quot;text-muted&quot;&gt;生命周期 owner 与通知订阅分层&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;table-responsive&quot;&gt;
      &lt;table class=&quot;table table-sm&quot;&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;read(childSpec)&lt;/code&gt;&lt;/td&gt;&lt;td&gt;VM1.virtual 保活 child，不监听 child 自身的 &lt;code&gt;notifyListeners()&lt;/code&gt;；handle recreate/dispose 仍会被 parent 感知。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr class=&quot;pob-recommended&quot;&gt;&lt;td&gt;&lt;code&gt;watch(childSpec)&lt;/code&gt;&lt;/td&gt;&lt;td&gt;VM1.virtual 只监听 child 一次；child 更新后先调用 &lt;code&gt;parent.onDependencyNotify(child)&lt;/code&gt;，再由框架调用 &lt;code&gt;parent.notifyListeners()&lt;/code&gt;。传播事务按 binding 去重，diamond graph 与 root 同时直连 child 时也只更新一次。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;listen*&lt;/code&gt;&lt;/td&gt;&lt;td&gt;每次 API 调用只注册一个副作用 callback，归当前 parent generation 所有；不会按 A/B 数量复制。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Pause / resume&lt;/td&gt;&lt;td&gt;虚拟 binding 不持有 route/app pause provider。更新先冒泡到 parent，再由各 root 自己的暂停状态决定是否刷新。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;重复 getter&lt;/td&gt;&lt;td&gt;复用既有 handle 和 listener，不重复 bind、不重复业务回调。&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
    &lt;pre class=&quot;pob-code&quot;&gt;&lt;code&gt;child.notifyListeners()
  → VM1.virtual observes child once
  → VM1.onDependencyNotify(child)
  → VM1.notifyListeners()
  → roots that watch(VM1) update once&lt;/code&gt;&lt;/pre&gt;

    &lt;div class=&quot;pob-section-head&quot;&gt;
      &lt;h3&gt;高级 cached lookup · 通常不推荐&lt;/h3&gt;
      &lt;span class=&quot;text-muted&quot;&gt;不要替代 spec-based dependency resolution&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      一般不要绕过 spec，直接按 key/tag 获取已有缓存。cached API 依赖其他路径已经创建实例，会耦合 cache identity、创建顺序与其他 owner 的生命周期，也不能创建缺失依赖。只有明确需要跨 owner 查询缓存并理解这些影响时才使用。
    &lt;/div&gt;
    &lt;div class=&quot;table-responsive&quot;&gt;
      &lt;table class=&quot;table table-sm&quot;&gt;
        &lt;thead&gt;
          &lt;tr&gt;&lt;th&gt;API&lt;/th&gt;&lt;th&gt;缺失行为&lt;/th&gt;&lt;th&gt;命中后的 parent 行为&lt;/th&gt;&lt;/tr&gt;
        &lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;watchCached(key/tag)&lt;/code&gt;&lt;/td&gt;&lt;td&gt;抛错，不创建&lt;/td&gt;&lt;td&gt;建立生命周期边、监听 VM 通知并感知 recreate/dispose。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;readCached(key/tag)&lt;/code&gt;&lt;/td&gt;&lt;td&gt;抛错，不创建&lt;/td&gt;&lt;td&gt;建立生命周期边；不监听 VM 通知，但感知 recreate/dispose。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;maybeWatchCached(key/tag)&lt;/code&gt;&lt;/td&gt;&lt;td&gt;返回 &lt;code&gt;null&lt;/code&gt;&lt;/td&gt;&lt;td&gt;命中语义与 &lt;code&gt;watchCached&lt;/code&gt; 相同。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;maybeReadCached(key/tag)&lt;/code&gt;&lt;/td&gt;&lt;td&gt;返回 &lt;code&gt;null&lt;/code&gt;&lt;/td&gt;&lt;td&gt;命中语义与 &lt;code&gt;readCached&lt;/code&gt; 相同。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;watchCachesByTag(tag)&lt;/code&gt;&lt;/td&gt;&lt;td&gt;返回空列表，不创建&lt;/td&gt;&lt;td&gt;每个命中项都建立边并监听 VM 通知。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;readCachesByTag(tag)&lt;/code&gt;&lt;/td&gt;&lt;td&gt;返回空列表，不创建&lt;/td&gt;&lt;td&gt;每个命中项都建立边；只感知 recreate/dispose。&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
    &lt;div class=&quot;text-muted&quot;&gt;按 tag 获取单个实例可能有歧义并依赖缓存创建顺序；多个实例可能共用 tag 时使用批量 API。&lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;pob-section&quot; aria-labelledby=&quot;pob-events-title&quot;&gt;
    &lt;div class=&quot;pob-section-head&quot;&gt;
      &lt;h2 id=&quot;pob-events-title&quot;&gt;生命周期事件契约&lt;/h2&gt;
    &lt;/div&gt;
    &lt;div class=&quot;table-responsive&quot;&gt;
      &lt;table class=&quot;table table-sm&quot;&gt;
        &lt;thead&gt;
          &lt;tr&gt;&lt;th&gt;事件&lt;/th&gt;&lt;th&gt;Parent virtual binding&lt;/th&gt;&lt;th&gt;Child 结果&lt;/th&gt;&lt;/tr&gt;
        &lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;A dispose，但 B 仍持有 VM1&lt;/td&gt;&lt;td&gt;保持 active&lt;/td&gt;&lt;td&gt;对象和状态均保持；移除传播到 child 的 A source，若无其他 A 路径则触发一次 &lt;code&gt;onUnbind(A)&lt;/code&gt;。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;VM1 最后一个 root owner 离开&lt;/td&gt;&lt;td&gt;随 VM1 dispose&lt;/td&gt;&lt;td&gt;释放 VM1 的引用；没有其他 owner 的 child 自动 dispose。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;aliveForever&lt;/code&gt; VM1 roots 归零&lt;/td&gt;&lt;td&gt;继续 active&lt;/td&gt;&lt;td&gt;已解析子图被传递性保活，直到 VM1 被强制 recycle/reset。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Nested &lt;code&gt;aliveForever&lt;/code&gt; VM2&lt;/td&gt;&lt;td&gt;必须显式 key&lt;/td&gt;&lt;td&gt;禁止使用 parent-private default key，避免 parent generation 销毁后留下无法再次命中的孤儿缓存。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;recycle(VM1)&lt;/code&gt;&lt;/td&gt;&lt;td&gt;强制 dispose&lt;/td&gt;&lt;td&gt;正常释放 child；私有 child 可能随之 dispose，共享 child 若还有 owner 则继续存活。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;recycle(VM2)&lt;/code&gt;&lt;/td&gt;&lt;td&gt;VM1 继续存活并移除旧 handle&lt;/td&gt;&lt;td&gt;旧 VM2 被全局强制 dispose；下次 getter 创建并重新绑定新 VM2。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr class=&quot;pob-recommended&quot;&gt;&lt;td&gt;&lt;code&gt;recreate(VM1)&lt;/code&gt;&lt;/td&gt;&lt;td&gt;当前实现采用 generation-scoped：旧 scope dispose，新对象获得新 scope&lt;/td&gt;&lt;td&gt;成功时保留 VM1 的 incoming root bindings，但不迁移旧 dependency tree；失败时旧对象与旧 dependency scope 原样保留。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;recreate(VM2)&lt;/code&gt;&lt;/td&gt;&lt;td&gt;incoming virtual binding 保持&lt;/td&gt;&lt;td&gt;child handle 原位换对象；VM1 后续 getter 返回 replacement，watch listener 迁移。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;ViewModel.reset()&lt;/code&gt;&lt;/td&gt;&lt;td&gt;全部幂等关闭&lt;/td&gt;&lt;td&gt;不依赖 Store 遍历顺序；包括 aliveForever 与构造中事务都完整清理。&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;pob-section&quot; aria-labelledby=&quot;pob-construction-title&quot;&gt;
    &lt;div class=&quot;pob-section-head&quot;&gt;
      &lt;h2 id=&quot;pob-construction-title&quot;&gt;构造、销毁与安全边界&lt;/h2&gt;
    &lt;/div&gt;
    &lt;div class=&quot;viz-grid&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;
        &lt;h3&gt;Construction transaction&lt;/h3&gt;
        &lt;div&gt;builder 执行时建立 construction transaction；对象在构造器/onCreate 中按需创建 dependency scope 并登记 rollback。builder 抛错时原子释放期间创建的 children、listeners 与边。&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;
        &lt;h3&gt;Cycle detection&lt;/h3&gt;
        &lt;div&gt;构造期使用 resolution stack，运行期新增边前检查 child 是否可达 parent。发现 self/indirect cycle 时先拒绝绑定，再抛出带完整路径的错误。&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;
        &lt;h3&gt;Dispose gate&lt;/h3&gt;
        &lt;div&gt;parent 一旦进入 disposing，立即拒绝新 resolve 和通知冒泡；先清理虚拟 subscriptions，再释放 child bindings。不要在 &lt;code&gt;dispose()&lt;/code&gt; 中重新解析依赖。&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;pre class=&quot;pob-code&quot;&gt;&lt;code&gt;begin parent construction transaction
  → run builder with synchronous construction lineage context
  → first nested resolve lazily creates and registers VM1.virtual
  → nested dependencies bind to VM1.virtual
  → success: commit scope to VM1 generation
  → failure: rollback scope and every tentative dependency&lt;/code&gt;&lt;/pre&gt;
    &lt;div class=&quot;table-responsive&quot;&gt;
      &lt;table class=&quot;table table-sm&quot;&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;异步引用&lt;/td&gt;&lt;td&gt;&lt;code&gt;final child = vm2; await ...; child.use()&lt;/code&gt; 仍可能跨过 parent 最终 dispose 或显式 recycle。跨 &lt;code&gt;await&lt;/code&gt; 后重新通过 getter 解析，或让任务随 parent 取消。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Getter 规则&lt;/td&gt;&lt;td&gt;继续禁止长期缓存 nested VM。自然的 root owner 切换不再重建 child，但危险的 &lt;code&gt;recycle&lt;/code&gt; 与异步销毁仍要求 getter 获取。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;循环迁移&lt;/td&gt;&lt;td&gt;把共同状态抽成第三个模块，或将反向关系改成事件/回调；不要用另一条 managed &lt;code&gt;read/watch&lt;/code&gt; 建立所有权回边。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;onCreate&lt;/code&gt; 异常&lt;/td&gt;&lt;td&gt;保持既有契约：交给 &lt;code&gt;ViewModelConfig.onError&lt;/code&gt;，实例继续完成创建，不作为 recreate 回滚信号；builder/constructor 抛错才触发失败原子回滚。&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;pob-section&quot; aria-labelledby=&quot;pob-code-map-title&quot;&gt;
    &lt;div class=&quot;pob-section-head&quot;&gt;
      &lt;h2 id=&quot;pob-code-map-title&quot;&gt;代码重构映射&lt;/h2&gt;
    &lt;/div&gt;
    &lt;div class=&quot;table-responsive&quot;&gt;
      &lt;table class=&quot;table table-sm&quot;&gt;
        &lt;thead&gt;
          &lt;tr&gt;&lt;th&gt;位置&lt;/th&gt;&lt;th&gt;职责变化&lt;/th&gt;&lt;/tr&gt;
        &lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;binding_zone.dart&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Zone 承载 construction root fallback；&lt;code&gt;ViewModelBindingHandler&lt;/code&gt; 使用 source-aware refs 保留 inbound owners/兼容的 &lt;code&gt;primaryOwner&lt;/code&gt; diagnostics，但不再用 primary owner 解析嵌套依赖。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;view_model.dart&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;viewModelBinding&lt;/code&gt; 始终返回当前对象自己的 dependency binding；增加 dependency update 入口与 disposing gate，并在 parent 销毁时释放 scope。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;view_model_binding.dart&lt;/code&gt;&lt;/td&gt;&lt;td&gt;新增 internal &lt;code&gt;ViewModelDependencyBinding&lt;/code&gt;；拆出 source-aware watch update hook 与可复用 default-key scope。Root binding 的公开 API 保持不变。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;auto_dispose.dart&lt;/code&gt;&lt;/td&gt;&lt;td&gt;在 bind、track、recreate listener 与 dispose 流程中传递 handle attachment 事件；运行期 cycle 校验失败时原子撤销刚建立的 bind/ref。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;store.dart&lt;/code&gt;&lt;/td&gt;&lt;td&gt;支持 source-aware binding、构造事务提交/回滚与 construction lineage 检测；保证 builder/constructor 失败时没有半注册 handle 或 virtual binding。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;DevTools&lt;/td&gt;&lt;td&gt;显式登记所有已观测的 root/dependency binding（包括无 VM 关系的已初始化 root），输出 active/disposed、parent generation 与兼容的 ordered owners、&lt;code&gt;primaryOwner&lt;/code&gt;/handoff。新图协议改用 &lt;code&gt;bindingOwnsViewModel&lt;/code&gt; / &lt;code&gt;viewModelOwnsDependencyBinding&lt;/code&gt; typed relationships，不兼容旧 edge payload；UI 按深度显示 &lt;code&gt;root binding → parent VM → virtual binding → child VM&lt;/code&gt;。&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;pob-section&quot; aria-labelledby=&quot;pob-rollout-title&quot;&gt;
    &lt;div class=&quot;pob-section-head&quot;&gt;
      &lt;h2 id=&quot;pob-rollout-title&quot;&gt;实现状态与发布门槛&lt;/h2&gt;
    &lt;/div&gt;
    &lt;div class=&quot;table-responsive&quot;&gt;
      &lt;table class=&quot;table table-sm&quot;&gt;
        &lt;thead&gt;
          &lt;tr&gt;&lt;th&gt;阶段&lt;/th&gt;&lt;th&gt;内容&lt;/th&gt;&lt;th&gt;完成条件&lt;/th&gt;&lt;/tr&gt;
        &lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;0 · 契约&lt;/td&gt;&lt;td&gt;generation scope、DAG、watch 冒泡、dispose 与 recreate 规则。&lt;/td&gt;&lt;td&gt;已完成：README、架构指南与行为测试保持一致。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;1 · Source-aware refs&lt;/td&gt;&lt;td&gt;default key、direct/parent source 与内部 owner abstraction。&lt;/td&gt;&lt;td&gt;已完成：仅首 source onBind、最后 source onUnbind。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;2 · Dependency binding&lt;/td&gt;&lt;td&gt;parent-owned resolution、construction transaction、unkeyed parent scope。&lt;/td&gt;&lt;td&gt;已完成：A/B shared parent 场景 VM2 identity/state 连续。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;3 · 特殊生命周期&lt;/td&gt;&lt;td&gt;watch/listen、recreate/recycle、aliveForever、reset 与 dispose 顺序。&lt;/td&gt;&lt;td&gt;已完成：公开解析 API 与组合生命周期已覆盖。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;4 · Safety&lt;/td&gt;&lt;td&gt;构造/运行期判环、传播事务去重与失败原子回滚。&lt;/td&gt;&lt;td&gt;已完成：self/indirect cycle、diamond 与失败 recreate 均有测试。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr class=&quot;pob-recommended&quot;&gt;&lt;td&gt;发布门槛&lt;/td&gt;&lt;td&gt;作为新的生命周期/identity 契约发布。&lt;/td&gt;&lt;td&gt;不要在 1.x patch 中静默改变。&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;pob-section&quot; aria-labelledby=&quot;pob-tests-title&quot;&gt;
    &lt;div class=&quot;pob-section-head&quot;&gt;
      &lt;h2 id=&quot;pob-tests-title&quot;&gt;已覆盖测试矩阵&lt;/h2&gt;
      &lt;span class=&quot;text-muted&quot;&gt;全量测试通过；测试内只通过 spec + binding 解析 VM&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;table-responsive&quot;&gt;
      &lt;table class=&quot;table table-sm&quot;&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;Shared lifecycle&lt;/td&gt;&lt;td&gt;A/B 共享 parent；child 在 B 加入前后创建；A 退出不换 child，B 最后退出后 parent/私有 child 各 dispose 一次。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Identity&lt;/td&gt;&lt;td&gt;同 parent unkeyed 复用、不同 parent 隔离、root 与 parent 隔离；多个 parent/root 显式 keyed child 正确合并并按最后 owner 回收。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Construction&lt;/td&gt;&lt;td&gt;constructor 多级依赖、parent/child builder 抛错均回滚且无 Store、binding、listener 残留；onCreate 抛错验证继续走 &lt;code&gt;onError&lt;/code&gt; 且不回滚。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Cycles&lt;/td&gt;&lt;td&gt;self、构造期与运行期的直接/间接环快速失败；diamond graph 不误报。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Reactivity&lt;/td&gt;&lt;td&gt;read 不冒泡；watch 每次 child 更新只通知 parent/watch roots 一次；read root 不更新；listen 不按 root 数量重复。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Lifecycle controls&lt;/td&gt;&lt;td&gt;parent/child recreate、parent/child recycle、aliveForever 组合、无序 reset 均符合事件表。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Async &amp; diagnostics&lt;/td&gt;&lt;td&gt;跨 await 的最后 owner dispose、getter 再解析、virtual owner 生命周期钩子、DevTools parent edge 与 generation 全部可观测。&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
  &lt;/section&gt;
&lt;/div&gt;

&lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&#x27;parent-owned-binding-redesign&#x27;);
    if (!root) return;

    const steps = [
      {
        a: true,
        b: false,
        parent: true,
        scope: true,
        child: false,
        owners: &#x27;A&#x27;,
        childOwner: &#x27;∅&#x27;,
        childState: &#x27;—&#x27;,
        detail: &#x27;A 创建并绑定 keyed VM1；VM1 的依赖作用域尚未创建任何 child。&#x27;
      },
      {
        a: true,
        b: true,
        parent: true,
        scope: true,
        child: false,
        owners: &#x27;A · B&#x27;,
        childOwner: &#x27;∅&#x27;,
        childState: &#x27;—&#x27;,
        detail: &#x27;B 命中同一个 keyed VM1；B 只成为 VM1 的 external owner，不需要同步到尚未解析的 children。&#x27;
      },
      {
        a: true,
        b: true,
        parent: true,
        scope: true,
        child: true,
        owners: &#x27;A · B&#x27;,
        childOwner: &#x27;VM1.virtual · A · B&#x27;,
        childState: &#x27;42&#x27;,
        detail: &#x27;VM1 成功解析 VM2；VM1.virtual 保活 VM2，并把当前 A/B bindings 作为 source-aware refs 传播给 VM2。&#x27;
      },
      {
        a: false,
        b: true,
        parent: true,
        scope: true,
        child: true,
        owners: &#x27;B&#x27;,
        childOwner: &#x27;VM1.virtual · B&#x27;,
        childState: &#x27;42&#x27;,
        detail: &#x27;A dispose 同时解除 A→VM1 与传播到 VM2 的 A source。VM1/VM2 仍由 B 与 virtual binding 保活，identity 和状态连续。&#x27;
      },
      {
        a: false,
        b: false,
        parent: false,
        scope: false,
        child: false,
        owners: &#x27;∅&#x27;,
        childOwner: &#x27;released&#x27;,
        childState: &#x27;disposed&#x27;,
        detail: &#x27;B 最后退出后 VM1 dispose，并释放 VM1.virtual；这里假设 VM2 没有其他 owner，因此随之 dispose。&#x27;
      }
    ];

    let step = 0;

    const byId = (id) =&gt; root.querySelector(`#${id}`);
    const toggle = (element, visible) =&gt; element.classList.toggle(&#x27;pob-hidden&#x27;, !visible);

    function render() {
      const state = steps[step];

      root.querySelectorAll(&#x27;[data-step]&#x27;).forEach((button) =&gt; {
        const selected = Number(button.dataset.step) === step;
        button.setAttribute(&#x27;aria-pressed&#x27;, String(selected));
        button.classList.toggle(&#x27;btn-primary&#x27;, selected);
      });

      const nodeA = byId(&#x27;pob-node-a&#x27;);
      nodeA.classList.toggle(&#x27;pob-muted&#x27;, !state.a);
      nodeA.classList.toggle(&#x27;pob-disposed&#x27;, !state.a);
      byId(&#x27;pob-node-a-state&#x27;).textContent = state.a ? &#x27;active&#x27; : &#x27;disposed&#x27;;

      const nodeB = byId(&#x27;pob-node-b&#x27;);
      nodeB.classList.toggle(&#x27;pob-muted&#x27;, !state.b);
      nodeB.classList.toggle(&#x27;pob-disposed&#x27;, step === 4);
      byId(&#x27;pob-node-b-state&#x27;).textContent = state.b
        ? &#x27;active&#x27;
        : step === 4
          ? &#x27;disposed&#x27;
          : &#x27;尚未绑定&#x27;;

      const parentNode = byId(&#x27;pob-node-parent&#x27;);
      parentNode.classList.toggle(&#x27;pob-muted&#x27;, !state.parent);
      parentNode.classList.toggle(&#x27;pob-disposed&#x27;, !state.parent);
      byId(&#x27;pob-parent-owners&#x27;).textContent = `external owners: ${state.owners}`;
      byId(&#x27;pob-parent-state&#x27;).textContent = state.parent
        ? &#x27;generation: alive&#x27;
        : &#x27;generation: disposed&#x27;;

      const scopeNode = byId(&#x27;pob-node-scope&#x27;);
      scopeNode.classList.toggle(&#x27;pob-muted&#x27;, !state.scope);
      scopeNode.classList.toggle(&#x27;pob-disposed&#x27;, !state.scope);
      byId(&#x27;pob-scope-state&#x27;).textContent = state.scope
        ? &#x27;dependency binding&#x27;
        : &#x27;binding disposed&#x27;;
      byId(&#x27;pob-scope-count&#x27;).textContent = `children: ${state.child ? 1 : 0}`;

      const childNode = byId(&#x27;pob-node-child&#x27;);
      childNode.classList.toggle(&#x27;pob-muted&#x27;, !state.child);
      childNode.classList.toggle(&#x27;pob-disposed&#x27;, step === 4);
      byId(&#x27;pob-child-title&#x27;).textContent = state.child
        ? &#x27;VM2 · alive&#x27;
        : step === 4
          ? &#x27;VM2 · disposed&#x27;
          : &#x27;VM2 · not resolved&#x27;;
      byId(&#x27;pob-child-owner&#x27;).textContent = `owner: ${state.childOwner}`;
      byId(&#x27;pob-child-state&#x27;).textContent = `state: ${state.childState}`;

      toggle(byId(&#x27;pob-edge-a-parent&#x27;), state.a);
      toggle(byId(&#x27;pob-edge-b-parent&#x27;), state.b);
      toggle(byId(&#x27;pob-label-b-parent&#x27;), state.b);
      toggle(byId(&#x27;pob-edge-parent-scope&#x27;), state.scope);
      toggle(byId(&#x27;pob-edge-scope-child&#x27;), state.child);
      toggle(byId(&#x27;pob-label-scope-child&#x27;), state.child);

      byId(&#x27;pob-stat-parent&#x27;).textContent = state.owners;
      byId(&#x27;pob-stat-child&#x27;).textContent = state.childOwner;
      byId(&#x27;pob-stat-state&#x27;).textContent = state.childState;
      byId(&#x27;pob-stat-state-note&#x27;).textContent = state.child
        ? &#x27;跨 root owner 切换保持&#x27;
        : step === 4
          ? &#x27;随最后 owner 释放&#x27;
          : &#x27;尚未创建&#x27;;
      byId(&#x27;pob-step-detail&#x27;).textContent = state.detail;
      byId(&#x27;pob-diagram-note&#x27;).textContent = step === 4
        ? &#x27;Parent 销毁时释放虚拟 binding；这只是正常 unbind，不会强制销毁仍被共享的 child。&#x27;
        : &#x27;VM1.virtual 保证生命周期下限；A/B bindings 同时实时传播到 VM2。&#x27;;
    }

    root.querySelectorAll(&#x27;[data-step]&#x27;).forEach((button) =&gt; {
      button.addEventListener(&#x27;click&#x27;, () =&gt; {
        step = Number(button.dataset.step);
        render();
      });
    });

    render();
  })();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
