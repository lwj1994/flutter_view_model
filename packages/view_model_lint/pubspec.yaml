repository: https://github.com/lwj1994/flutter_view_model/tree/main/packages/view_model_lint

environment:
  sdk: '>=3.13.0 <4.0.0'

executables:
  view_model_lint_fix: fix

dependencies:
  analysis_server_plugin: ^0.3.22
  analyzer: '>=14.3.0 <15.0.0'
  analyzer_plugin: ^0.14.16

dev_dependencies:
  analyzer_testing: ^0.4.1
  test: ^1.25.0
  test_reflective_loader: ^0.4.0
