name: view_model Workflow

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  codecov-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test publish warning gate
        run: python3 -m unittest discover -s .github/scripts/tests -v

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify toolchain
        timeout-minutes: 2
        run: |
          dart --version
          flutter --version

      - name: Use local annotation package
        shell: bash
        run: |
          packages=(
            packages/view_model
            packages/view_model_generator
            packages/view_model_devtools_extension
            example/counter
            example/todo_list
          )

          # Check every target before writing any temporary override files.
          for package in "${packages[@]}"
          do
            overrides="$package/pubspec_overrides.yaml"
            if [[ -e "$overrides" || -L "$overrides" ]]; then
              echo "::error file=$overrides::Existing overrides detected. Update this CI setup to merge the local annotation entry explicitly; refusing to overwrite this file."
              exit 1
            fi
          done

          # CI-only files: leave the published pubspec.yaml dependencies intact.
          # Also reject a file created between the preflight and this write.
          set -o noclobber
          for package in "${packages[@]}"
          do
            printf 'dependency_overrides:\n  view_model_annotation:\n    path: "%s"\n' \
              "$GITHUB_WORKSPACE/packages/view_model_annotation" \
              > "$package/pubspec_overrides.yaml"
          done

      - name: Check view_model
        timeout-minutes: 5
        working-directory: packages/view_model
        run: |
          flutter pub get
          dart format --set-exit-if-changed -l 80 -o none lib test
          dart analyze --fatal-infos --fatal-warnings lib
          flutter test --concurrency=1 --coverage test

      - name: Check view_model_annotation
        timeout-minutes: 3
        working-directory: packages/view_model_annotation
        run: |
          dart pub get
          dart format --set-exit-if-changed -l 80 -o none lib
          dart analyze --fatal-infos --fatal-warnings lib

      - name: Check view_model_generator
        timeout-minutes: 5
        working-directory: packages/view_model_generator
        run: |
          dart pub get
          dart format --set-exit-if-changed -l 80 -o none lib test
          dart analyze --fatal-infos --fatal-warnings lib test
          dart test

      - name: Check generated specs against view_model runtime
        timeout-minutes: 5
        working-directory: packages/view_model_generator/example
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart analyze --fatal-infos --fatal-warnings lib
          git diff --exit-code -- lib/example.vm.dart

      - name: Check view_model_devtools_extension
        timeout-minutes: 5
        working-directory: packages/view_model_devtools_extension
        run: |
          flutter pub get
          dart format --set-exit-if-changed -l 80 -o none lib test
          dart analyze --fatal-infos --fatal-warnings lib test
          flutter test --concurrency=1

      - name: Check example counter
        timeout-minutes: 4
        working-directory: example/counter
        run: |
          flutter pub get
          dart format --set-exit-if-changed -l 80 -o none lib test
          dart analyze --fatal-infos --fatal-warnings lib test
          flutter test --concurrency=1

      - name: Check example todo_list
        timeout-minutes: 4
        working-directory: example/todo_list
        run: |
          flutter pub get
          dart format --set-exit-if-changed -l 80 -o none lib test
          dart analyze --fatal-infos --fatal-warnings lib test
          flutter test --concurrency=1

      - name: Upload coverage to Codecov
        timeout-minutes: 1
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/view_model/coverage/lcov.info
